name: 'Prepare n8n Docker (reusable)'

# Reusable workflow that ensures the n8n + runners CI test images for the
# current commit SHA are present in the GHA cache. Cache-aware: if another
# job in the same run already populated `n8n-docker-image-<sha>`, this
# becomes a no-op.
#
# Downstream jobs restore the same SHA-keyed cache via load-n8n-docker.

on:
  workflow_call:
    inputs:
      chalk_on:
        description: "racecar: instrumented arm switch, passed down by the caller"
        type: string
        default: "false"
      profile:
        description: CrashOverride chalk profile
        type: string
        default: curiosity-tests-racecar
      build-variant:
        description: 'standard, coverage, or pc'
        required: false
        default: 'standard'
        type: string
      runner:
        description: 'Runner for the build.'
        required: false
        default: 'ubuntu-latest'
        type: string
      branch:
        description: 'Git ref to check out.'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  id-token: write

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.chalk_on }}

jobs:
  prepare:
    name: 'Build & publish image'
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          observables_continue_on_error: false
          lfs: false
          ref: ${{ inputs.branch || github.ref }}
          fetch-depth: 1
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

      - name: Build and publish image
        uses: ./.github/actions/build-n8n-docker
        with:
          build-variant: ${{ inputs.build-variant }}
        env:
          QA_METRICS_WEBHOOK_URL: ${{ secrets.QA_METRICS_WEBHOOK_URL }}
          QA_METRICS_WEBHOOK_USER: ${{ secrets.QA_METRICS_WEBHOOK_USER }}
          QA_METRICS_WEBHOOK_PASSWORD: ${{ secrets.QA_METRICS_WEBHOOK_PASSWORD }}
