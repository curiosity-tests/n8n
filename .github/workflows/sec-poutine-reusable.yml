name: 'Sec: Poutine Scan'

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      chalk_on:
        description: "racecar: instrumented arm switch, passed down by the caller"
        type: string
        default: "false"
      profile:
        description: CrashOverride chalk profile
        type: string
        default: curiosity-tests-racecar
      ref:
        description: GitHub ref to scan.
        required: false
        type: string
        default: ''

permissions:
  contents: read
  security-events: write
  id-token: write

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.chalk_on }}

jobs:
  poutine_scan:
    name: Poutine Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          observables_continue_on_error: false
          lfs: false
          ref: ${{ inputs.ref }}
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

      - name: Run Poutine Security Scanner
        uses: boostsecurityio/poutine-action@84c0a0d32e8d57ae12651222be1eb15351429228 # v0.15.2

      - name: Fail on error-level findings
        run: |
          # Check SARIF for error-level findings
          if jq -e '.runs[].results[] | select(.level == "error")' results.sarif > /dev/null 2>&1; then
            echo "::error::Poutine found error-level security findings:"
            jq -r '.runs[].results[] | select(.level == "error") | "  - \(.ruleId): \(.message.text)"' results.sarif
            exit 1
          fi
          echo "No error-level findings detected"

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@48ab28a6f5dbc2a99bf1e0131198dd8f1df78169 # v3.28.0
        if: github.repository == 'curiosity-tests/n8n'
        with:
          sarif_file: results.sarif
