name: 'Test: Dev-server boot smoke'

on:
  workflow_call:
    inputs:
      chalk_on:
        description: "racecar: instrumented arm switch, passed down by the caller"
        type: string
        default: "false"
      profile:
        description: CrashOverride chalk profile
        type: string
        default: curiosity-tests-racecar
      ref:
        description: 'Git ref to test'
        required: true
        type: string

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.chalk_on }}
  NODE_OPTIONS: '--max-old-space-size=6144'
  PLAYWRIGHT_BROWSERS_PATH: packages/testing/playwright/.playwright-browsers

permissions:
  contents: read
  id-token: write

jobs:
  smoke:
    name: Dev-server smoke
    runs-on: ${{ vars.RUNNER_PROVIDER == 'github' && 'ubuntu-latest' || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          observables_continue_on_error: false
          lfs: false
          fetch-depth: 1
          ref: ${{ inputs.ref }}
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

      - name: Setup and Build
        uses: ./.github/actions/setup-nodejs

      - name: Install Browsers
        run: pnpm turbo run install-browsers --filter=n8n-playwright

      # Both steps run from repo root so PLAYWRIGHT_BROWSERS_PATH (relative)
      # resolves correctly. cd-ing into the playwright package double-nests it.
      - name: Run dev-server smoke spec (non-default ports)
        # Runs FIRST, while nothing has ever listened on 5678, so a regression
        # to the 5678 fallback fails with a connection error instead of being
        # satisfied by a server leaked from the default run. The broker moves
        # too, so it cannot squat on 5679 for the run below.
        run: pnpm --filter=n8n-playwright test:dev-server-smoke:alt-port --reporter=list

      - name: Run dev-server smoke spec
        # Always run: a flake above must not cost the default-port signal.
        if: ${{ !cancelled() }}
        run: pnpm --filter=n8n-playwright test:dev-server-smoke --reporter=list

      - name: Upload Failure Artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: dev-server-smoke-report
          path: |
            packages/testing/playwright/test-results/
            packages/testing/playwright/playwright-report/
          retention-days: 7
