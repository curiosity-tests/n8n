name: 'QA: Metrics PR Comment'

on:
  workflow_call:
    inputs:
      chalk_on:
        description: "racecar: instrumented arm switch, passed down by the caller"
        type: string
        default: "false"
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      metrics:
        description: 'Comma-separated list of metric names to report'
        required: true
        type: string
      baseline-days:
        description: 'Number of days for the rolling baseline'
        required: false
        type: number
        default: 30

permissions:
  contents: read
  id-token: write

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.chalk_on }}

jobs:
  post-comment:
    name: Post Metrics Comment
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.head.repo.fork &&
      github.repository == 'curiosity-tests/n8n'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      pull-requests: write
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          observables_continue_on_error: false
          lfs: false
          sparse-checkout: .github/scripts/post-qa-metrics-comment.mjs
          sparse-checkout-cone-mode: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

      - name: Post QA metrics comparison
        env:
          QA_METRICS_COMMENT_WEBHOOK_URL: ${{ secrets.QA_METRICS_COMMENT_WEBHOOK_URL }}
          QA_METRICS_WEBHOOK_USER: ${{ secrets.QA_METRICS_WEBHOOK_USER }}
          QA_METRICS_WEBHOOK_PASSWORD: ${{ secrets.QA_METRICS_WEBHOOK_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
          METRICS: ${{ inputs.metrics }}
          BASELINE_DAYS: ${{ inputs.baseline-days }}
        run: |
          node .github/scripts/post-qa-metrics-comment.mjs \
            --metrics "$METRICS" \
            --baseline-days "$BASELINE_DAYS"
