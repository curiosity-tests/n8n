name: 'Test: DB Integration'

on:
  workflow_call:
    inputs:
      chalk_on:
        description: "racecar: instrumented arm switch, passed down by the caller"
        type: string
        default: "false"
      profile:
        description: CrashOverride chalk profile
        type: string
        default: curiosity-tests-racecar
      ref:
        required: false
        type: string
        default: ''
      matrix:
        description: 'Job matrix JSON, from .github/scripts/db-test-matrix.mjs.'
        required: true
        type: string

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.chalk_on }}
  NODE_OPTIONS: '--max-old-space-size=6144'

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.matrix) }}
    env:
      TEST_IMAGE_POSTGRES: ${{ matrix.TEST_IMAGE_POSTGRES }}
      COVERAGE_ENABLED: ${{ matrix.collectCoverage }}
    steps:
      - name: Checkout code
        uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          observables_continue_on_error: false
          lfs: false
          ref: ${{ inputs.ref }}
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

      - name: Setup and Build
        uses: ./.github/actions/setup-nodejs

      - name: Pre-pull Test Container Images
        run: pnpm --filter n8n-containers exec tsx pull-test-images.ts || true

      - name: Run Tests
        working-directory: packages/cli
        run: ${{ matrix.test-cmd }}

      - name: Run Migration Tests
        if: matrix.migration-cmd != ''
        working-directory: packages/cli
        run: ${{ matrix.migration-cmd }}

      # Regenerates the schema docs for this leg's database (sqlite temp file /
      # postgres testcontainer) and fails if they differ from what's committed.
      # tbls runs as a Docker image in CI.
      - name: Verify schema docs are up to date
        if: matrix.schema-check-cmd != ''
        run: ${{ matrix.schema-check-cmd }}

      - name: Upload coverage to Codecov
        if: env.COVERAGE_ENABLED == 'true'
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5.5.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: backend-integration-postgres
          name: backend-integration-postgres
          files: ./packages/cli/coverage/lcov.info
          fail_ci_if_error: false
