name: 'Sec: CI Checks'

on:
  workflow_call:
    inputs:
      chalk_on:
        description: "racecar: instrumented arm switch, passed down by the caller"
        type: string
        default: "false"
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      ref:
        description: GitHub ref to scan.
        required: false
        type: string
        default: ''

permissions:
  contents: read
  id-token: write

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.chalk_on }}

jobs:
  poutine-scan:
    name: Poutine Security Scan
    uses: ./.github/workflows/sec-poutine-reusable.yml
    with:
      ref: ${{ inputs.ref }}
    secrets: inherit

  zizmor-scan:
    name: Zizmor Security Scan
    uses: ./.github/workflows/sec-zizmor-reusable.yml

  # Future security checks can be added here:
  # - dependency-scan:
  # - secret-detection:
  # - container-scan:
